<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,567;1,567&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous"referrerpolicy="no-referrer"></script>
</head>

<body class="Login-regis">

    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">

        <div class="register-login-container">

            <h1 class="register-login-title montserrat-uniquifier">
                CREATE ACCOUNT
            </h1>

            <form id="myForm">

                <div>
                    <input type="text"
                           name="name"
                           class="form-control lora-uniquifier"
                           placeholder="Username">
                </div>

                <div>
                    <input type="email"
                           name="email"
                           class="form-control lora-uniquifier"
                           placeholder="Email Address">
                </div>

                <div>
                    <input type="tel"
                           name="phone"
                           class="form-control lora-uniquifier"
                           placeholder="Phone Number">
                </div>

                <div>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control lora-uniquifier"
                           placeholder="Password">
                </div>

                <div>
                    <input type="password"
                           name="confirmPassword"
                           class="form-control lora-uniquifier"
                           placeholder="Confirm Password">
                </div>

                <button type="submit" class="btn btn-light lora-uniquifier register-login-btn">
                    Register
                </button>

            </form>

            <div class="login-text lora-uniquifier">
                Already have an account?
                <div>
                    <a href="login.html">Login Here</a>
                </div>
            </div>

        </div>

    </div>

    <script>
        $(document).ready(function(){

            $("#myForm").validate({

                errorClass: "lora-uniquifier",

                rules: {

                    name: {
                        required: true,
                        minlength: 5,
                        maxlength: 10
                    },

                    email: {
                        required: true,
                        email: true
                    },

                    phone: {
                        required: true,
                        digits: true,
                        minlength: 11,
                        maxlength: 11
                    },

                    password: {
                        required: true,
                        minlength: 8,
                        maxlength: 15
                    },

                    confirmPassword: {
                        required: true,
                        equalTo: "#password"
                    }

                },

                messages: {

                    name: {
                        required: "Please enter your username.",
                        minlength: "Username must be at least 5 characters.",
                        maxlength: "Username must not exceed 10 characters."
                    },

                    email: {
                        required: "Please enter your email.",
                        email: "Please enter a valid email address."
                    },

                    phone: {
                        required: "Please enter your phone number.",
                        digits: "Phone number must contain numbers only.",
                        minlength: "Phone number must be 11 digits.",
                        maxlength: "Phone number must be 11 digits."
                    },

                    password: {
                        required: "Please enter your password.",
                        minlength: "Password must be at least 8 characters.",
                        maxlength: "Password must not exceed 15 characters."
                    },

                    confirmPassword: {
                        required: "Please confirm your password.",
                        equalTo: "Passwords do not match."
                    }

                }

            });

        });
    </script>

</body>
</html>
