<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,567;1,567&display=swap" rel="stylesheet">
    </head>
    <body class="Login-regis">

        <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">

            <div class="register-login-container">

                <h1 class="register-login-title montserrat-uniquifier">CREATE ACCOUNT</h1>

                <form>
                    <div>
                        <input type="text" class="form-control lora-uniquifier" placeholder="Username">
                    </div>

                    <div>
                        <input type="email" class="form-control lora-uniquifier" placeholder="Email Address">
                    </div>
                    
                    <div>
                        <input type="tel" class="form-control lora-uniquifier" placeholder="Phone Number">
                    </div>

                    <div>
                        <input type="password" class="form-control lora-uniquifier" placeholder="Password">
                    </div>

                    <div>
                        <input type="password" class="form-control lora-uniquifier" placeholder="Confirm Password">
                    </div>

                <a href="login.html" class="btn btn-light lora-uniquifier register-login-btn">
                    Register
                </a>

                </form>

                <div class="login-text lora-uniquifier">
                    Already have an account?
                    <div><a href="login.html">Login Here</a></div>
                </div>

            </div>

        </div>

    </body>
</html>
