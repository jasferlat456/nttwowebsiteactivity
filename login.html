<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,567;1,567&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    </head>
    <body class="Login-regis">

        <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">

            <div class="register-login-container">

                <h1 class="register-login-title montserrat-uniquifier">Studio 101<i class="bi bi-camera2" ></i></h1>

                <form id="loginForm">
                    <div>
                        <input type="text"
                                name="name"
                                class="form-control lora-uniquifier"
                                placeholder="Username">
                    </div>


                    <div>
                        <input type="password"
                                name="password"
                                class="form-control lora-uniquifier"
                                placeholder="Password">
                    </div>

                    <div id="loginError"></div>

                    <button type="submit" class="btn btn-light lora-uniquifier register-login-btn">
                        Login
                    </button>

                </form>

                <div class="login-text lora-uniquifier">
                    Create an account
                    <a href="register.html">Register Here</a>
                </div>

            </div>

        </div>

        <script>
            $(document).ready(function(){

                $("#loginForm").validate({

                    errorClass: "lora-uniquifier",

                    rules: {

                        name: {
                            required: true
                        },

                        password: {
                            required: true
                        }

                    },

                    messages: {

                        name: {
                            required: "Please enter your username."
                        },

                        password: {
                            required: "Please enter your password."
                        }

                    },

                    submitHandler: function(form) {

                        if ($("input[name='name']").val() == "Jasfer" &&
                            $("input[name='password']").val() == "Jasfer123") {

                            window.location.href = "index.html";

                        } else {

                            $("#loginError").text("Invalid username or password.");

                        }

                    }
                });

            });
        </script>


    </body>
</html>
